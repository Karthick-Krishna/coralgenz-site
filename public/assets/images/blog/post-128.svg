      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#032426"/>
    </linearGradient>
    <linearGradient id="horiz-128" x1="0" y1="350" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24e9f2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a2f6f9" stop-opacity="1"/>
