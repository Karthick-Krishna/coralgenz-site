        <circle cx="65" cy="-45" r="14" fill="#0f172a" stroke="#a2f6f9" stroke-width="2"/>
        <circle cx="-65" cy="45" r="14" fill="#0f172a" stroke="#e5227b" stroke-width="2"/>
