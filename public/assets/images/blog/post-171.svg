<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="slash-bg-171" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.6" stop-color="#260312"/>
      <stop offset="1" stop-color="#050a18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#slash-bg-171)"/>

  <!-- 20-Degree Diagonal Cyber Slash -->
  <polygon points="550 0 700 0 650 675 500 675" fill="#f23c88" opacity="0.12"/>
  <line x1="625" y1="0" x2="575" y2="675" stroke="#f9a2c6" stroke-width="2" opacity="0.6"/>

  <!-- Left Side: Cinematic Title Stack -->
  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#f23c88" opacity="0.2"/>
    <text x="12" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f9a2c6" letter-spacing="1">SECURITY &amp; VAULT</text>

    <text x="0" y="85" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#f23c88" letter-spacing="2.5">ENTERPRISE SOFTWARE BUILT TO LAST A GENERATION.</text>

    <!-- Main Title -->
    <text x="0" y="150" font-family="'Satoshi', 'Inter', sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">Year-End Security Checkup:</text>
    <text x="0" y="198" font-family="'Satoshi', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#f9a2c6">Lock Down Your Company Files</text>
    <text x="0" y="74" font-family="Satoshi, Inter, sans-serif" font-size="24" font-weight="800" fill="#cbd5e1" text-anchor="middle">Before...</text>

    <!-- Rating & Date Tag -->
