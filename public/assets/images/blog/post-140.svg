        <rect x="22" y="-36" width="14" height="14" rx="2" fill="#f2880c"/>
        <rect x="-42" y="16" width="26" height="26" rx="4" stroke="#f9d1a2" stroke-width="2.5" fill="none"/>
        <rect x="-36" y="22" width="14" height="14" rx="2" fill="#f2880c"/>
        <circle cx="0" cy="0" r="10" fill="#0055fe" stroke="#ffffff" stroke-width="2"/>
        
