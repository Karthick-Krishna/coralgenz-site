    <text x="0" y="45" font-family="'Satoshi', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">Client Success Story: Doubling</text>
    <text x="0" y="86" font-family="'Satoshi', 'Inter', sans-serif" font-size="30" font-weight="900" fill="#f9d1a2">Online Store Sales with Custom</text>
