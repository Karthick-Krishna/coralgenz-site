      <stop offset="1" stop-color="#261603"/>
    </linearGradient>
    <linearGradient id="horiz-140" x1="0" y1="350" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2880c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f9d1a2" stop-opacity="1"/>
