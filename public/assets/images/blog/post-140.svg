        <rect x="-55" y="-55" width="110" height="110" rx="16" fill="#0b1320" stroke="#f2880c" stroke-width="3"/>
        <rect x="-42" y="-42" width="26" height="26" rx="4" stroke="#f9d1a2" stroke-width="2.5" fill="none"/>
