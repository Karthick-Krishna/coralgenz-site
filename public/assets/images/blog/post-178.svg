      <circle cx="22" cy="22" r="5" fill="#38bdf8"/>
      <text x="38" y="27" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Salesforce ISV Enterprise CRM</text>
