    <text x="44" y="26" font-family="'Satoshi', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">CORALGENZ</text>

    <!-- Category Pill -->
    <rect x="200" y="0" width="210" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="305" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#bae6fd" letter-spacing="0.8" text-anchor="middle">ENTERPRISE ECOSYSTEM</text>

    <!-- Article ID & Date -->
    <text x="1080" y="26" text-anchor="end" font-family="'JetBrains Mono', 'Inter', monospace" font-size="13" font-weight="700" fill="#94a3b8">ARTICLE #178 · NOV 7, 2026</text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 160)">
