<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-29" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f1d"/>
      <stop offset="0.5" stop-color="#78350f"/>
      <stop offset="1" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="glow-29" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 337) rotate(90) scale(360 480)">
      <stop stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-grad-29" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid-29" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="675" fill="url(#bg-29)"/>
  <rect width="1200" height="675" fill="url(#grid-29)"/>
  <circle cx="920" cy="337" r="380" fill="url(#glow-29)"/>

  <!-- Top Header Navigation Bar -->
  <g transform="translate(60, 48)">
    <!-- Coralgenz Logo & Mark -->
    <rect width="185" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="13" fill="#0055fe"/>
    <path d="M 17 21 L 20 24 L 27 17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="26" font-family="'Satoshi', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">CORALGENZ</text>

    <!-- Category Pill -->
    <rect x="200" y="0" width="192" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="296" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#fcd34d" letter-spacing="0.8" text-anchor="middle">STARTUPS &amp; MVP</text>

    <!-- Article ID & Date -->
    <text x="1080" y="26" text-anchor="end" font-family="'JetBrains Mono', 'Inter', monospace" font-size="13" font-weight="700" fill="#94a3b8">ARTICLE #29 · DEC 5, 2025</text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="48" height="4" rx="2" fill="#f59e0b"/>

    <!-- Wrapped Article Title -->
    <text x="0" y="55" font-family="'Satoshi', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
      <tspan x="0" dy="0">5 Reasons Startup Apps Fail—And</tspan>
      <tspan x="0" dy="52">How to Make Sure Yours Succeeds</tspan>
      <tspan x="0" dy="52"></tspan>
    </text>

    <!-- Key Takeaway Pill -->
    <g transform="translate(0, 230)">
      <rect width="360" height="44" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.4"/>
      <circle cx="22" cy="22" r="5" fill="#f59e0b"/>
      <text x="38" y="27" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">4-Week Rapid MVP Launch Roadmap</text>
    </g>

    <!-- Authority Byline -->
    <text x="0" y="325" font-family="'Inter', sans-serif" font-size="14.5" font-weight="500" fill="#cbd5e1">
      Official Technology Playbook &amp; Architecture Roadmap by Coralgenz Global
    </text>
  </g>

  <!-- Right Graphic Area -->
  <g transform="translate(730, 130)">
    
        <!-- Launch Rocket & Velocity Roadmap -->
        <g transform="translate(40, 20)">
          <!-- Orbital rings -->
          <ellipse cx="160" cy="180" rx="140" ry="70" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.4" transform="rotate(-25 160 180)"/>
          <!-- Rocket Body -->
          <path d="M 160 50 C 160 50 200 90 200 160 C 200 190 185 220 160 230 C 135 220 120 190 120 160 C 120 90 160 50 160 50 Z" fill="#b45309" stroke="#fcd34d" stroke-width="3"/>
          <!-- Porthole -->
          <circle cx="160" cy="120" r="18" fill="#0f172a" stroke="#fcd34d" stroke-width="3"/>
          <circle cx="160" cy="120" r="8" fill="#38bdf8"/>
          <!-- Fins -->
          <path d="M 120 160 L 90 200 L 125 210 Z" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
          <path d="M 200 160 L 230 200 L 195 210 Z" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
          <!-- Flame -->
          <polygon points="145 230 160 270 175 230" fill="#ef4444"/>
          <polygon points="152 230 160 255 168 230" fill="#f59e0b"/>
          <!-- Milestone Badge -->
          <rect x="70" y="260" width="180" height="34" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="160" y="282" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#fcd34d" text-anchor="middle">WEEK 4: MARKET READY</text>
        </g>
        
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="670" width="1200" height="5" fill="url(#line-grad-29)"/>
</svg>
