    <rect x="200" y="0" width="138" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="#10b981" stroke-width="1.2"/>
    <text x="269" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#34d399" letter-spacing="0.8" text-anchor="middle">CASE STUDIES</text>

    <!-- Article ID & Date -->
    <text x="1080" y="26" text-anchor="end" font-family="'JetBrains Mono', 'Inter', monospace" font-size="13" font-weight="700" fill="#94a3b8">ARTICLE #139 · AUG 24, 2026</text>
  </g>

