          <path d="M 148 165 V 150 C 148 143.4 153.4 138 160 138 C 166.6 138 172 143.4 172 150 V 165" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="160" cy="178" r="4" fill="#064e3b"/>
