<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-62" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f1d"/>
      <stop offset="0.5" stop-color="#0055fe"/>
      <stop offset="1" stop-color="#0037a8"/>
    </linearGradient>
    <radialGradient id="glow-62" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 337) rotate(90) scale(360 480)">
      <stop stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-grad-62" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid-62" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="675" fill="url(#bg-62)"/>
  <rect width="1200" height="675" fill="url(#grid-62)"/>
  <circle cx="920" cy="337" r="380" fill="url(#glow-62)"/>

  <!-- Top Header Navigation Bar -->
  <g transform="translate(60, 48)">
    <!-- Coralgenz Logo & Mark -->
    <rect width="185" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="13" fill="#0055fe"/>
    <path d="M 17 21 L 20 24 L 27 17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="26" font-family="'Satoshi', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">CORALGENZ</text>

    <!-- Category Pill -->
    <rect x="200" y="0" width="219" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="309" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#bfdbfe" letter-spacing="0.8" text-anchor="middle">CERTIFICATION PROGRAM</text>

    <!-- Article ID & Date -->
    <text x="1080" y="26" text-anchor="end" font-family="'JetBrains Mono', 'Inter', monospace" font-size="13" font-weight="700" fill="#94a3b8">ARTICLE #62 · FEB 25, 2026</text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="48" height="4" rx="2" fill="#38bdf8"/>

    <!-- Wrapped Article Title -->
    <text x="0" y="55" font-family="'Satoshi', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
      <tspan x="0" dy="0">Inside the Coralgenz Certification</tspan>
      <tspan x="0" dy="52">Program: Real Skills, Zero</tspan>
      <tspan x="0" dy="52">Application...</tspan>
    </text>

    <!-- Key Takeaway Pill -->
    <g transform="translate(0, 230)">
      <rect width="360" height="44" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.4"/>
      <circle cx="22" cy="22" r="5" fill="#38bdf8"/>
      <text x="38" y="27" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Coimbatore &amp; Chennai Global Delivery</text>
    </g>

    <!-- Authority Byline -->
    <text x="0" y="325" font-family="'Inter', sans-serif" font-size="14.5" font-weight="500" fill="#cbd5e1">
      Official Technology Playbook &amp; Architecture Roadmap by Coralgenz Global
    </text>
  </g>

  <!-- Right Graphic Area -->
  <g transform="translate(730, 130)">
    
        <!-- Verified Enterprise Authority & Global Delivery Hub -->
        <g transform="translate(40, 25)">
          <circle cx="160" cy="160" r="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
          <ellipse cx="160" cy="160" rx="110" ry="45" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
          <ellipse cx="160" cy="160" rx="45" ry="110" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
          <!-- Central Crest -->
          <circle cx="160" cy="160" r="48" fill="#0055fe" stroke="#ffffff" stroke-width="3"/>
          <path d="M 145 160 L 155 170 L 178 147" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="50" y="255" width="220" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="160" y="277" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">COIMBATORE &amp; CHENNAI HQ</text>
        </g>
        
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="670" width="1200" height="5" fill="url(#line-grad-62)"/>
</svg>
