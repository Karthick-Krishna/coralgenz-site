        <line x1="0" y1="-42" x2="0" y2="-30" stroke="#f9bfa2" stroke-width="2" stroke-dasharray="2 2"/>
        <line x1="0" y1="-2" x2="0" y2="10" stroke="#22e5c4" stroke-width="2" stroke-dasharray="2 2"/>
