    <text x="0" y="55" font-family="'Satoshi', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
      <tspan x="0" dy="0">Client Success Story: Moving a</tspan>
      <tspan x="0" dy="52">15-Year-Old Office System to the</tspan>
      <tspan x="0" dy="52">Cloud</tspan>
    </text>

    <!-- Key Takeaway Pill -->
    <g transform="translate(0, 230)">
      <rect width="360" height="44" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#0ea5e9" stroke-width="1.4"/>
      <circle cx="22" cy="22" r="5" fill="#0ea5e9"/>
      <text x="38" y="27" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Microsoft Azure High-Availability</text>
    </g>

    <!-- Authority Byline -->
