    <rect width="185" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="13" fill="#0055fe"/>
    <path d="M 17 21 L 20 24 L 27 17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="26" font-family="'Satoshi', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">CORALGENZ</text>

    <!-- Category Pill -->
    <rect x="200" y="0" width="138" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="269" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" letter-spacing="0.8" text-anchor="middle">CASE STUDIES</text>

    <!-- Article ID & Date -->
    <text x="1080" y="26" text-anchor="end" font-family="'JetBrains Mono', 'Inter', monospace" font-size="13" font-weight="700" fill="#94a3b8">ARTICLE #138 · AUG 21, 2026</text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="48" height="4" rx="2" fill="#0ea5e9"/>

