    </pattern>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="675" fill="url(#bg-138)"/>
  <rect width="1200" height="675" fill="url(#grid-138)"/>
  <circle cx="920" cy="337" r="380" fill="url(#glow-138)"/>

  <!-- Top Header Navigation Bar -->
