      <stop offset="0.5" stop-color="#0c2603"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="spot-7" cx="600" cy="270" r="420" gradientUnits="userSpaceOnUse">
