<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-top-50" x1="0" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0d0326"/>
    </linearGradient>
    <linearGradient id="horiz-50" x1="0" y1="350" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f0cf2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bba2f9" stop-opacity="1"/>
      <stop offset="1" stop-color="#4f0cf2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Upper Panoramic Half -->
  <rect width="1200" height="350" fill="url(#bg-top-50)"/>
  <!-- Lower Dark Card -->
  <rect y="350" width="1200" height="325" fill="#040814"/>

  <!-- Horizon Laser Divider Line -->
  <line x1="0" y1="350" x2="1200" y2="350" stroke="url(#horiz-50)" stroke-width="3"/>
  <circle cx="600" cy="350" r="30" fill="#4f0cf2" opacity="0.3"/>

  <!-- Upper Focal Artwork -->
  <g transform="translate(600, 180)">
    
        <circle cx="0" cy="0" r="110" stroke="#4f0cf2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
        <ellipse cx="0" cy="0" rx="100" ry="40" stroke="#bba2f9" stroke-width="1.5" opacity="0.4"/>
        <ellipse cx="0" cy="0" rx="40" ry="100" stroke="#bba2f9" stroke-width="1.5" opacity="0.4"/>
        <circle cx="0" cy="0" r="42" fill="#0d0326" stroke="#4f0cf2" stroke-width="3"/>
        <path d="M -14 0 L -4 10 L 16 -10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-85" cy="0" r="5" fill="#e5bc22"/>
        <circle cx="85" cy="0" r="5" fill="#e5bc22"/>
        
  </g>

  <!-- Top Studio Bar -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2">CORALGENZ CINEMATIC</text>
    <text x="1080" y="0" font-family="'Inter', monospace" font-size="12" font-weight="700" fill="#bba2f9" text-anchor="end">#50 · ACCESSIBILITY &amp; UI</text>
  </g>

  <!-- Lower Title Card Content -->
  <g transform="translate(60, 410)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#4f0cf2" letter-spacing="3">ENTERPRISE SOFTWARE BUILT TO LAST A GENERATION.</text>
    <text x="0" y="45" font-family="'Satoshi', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">Making Websites Easy for Everyone to</text>
    <text x="0" y="86" font-family="'Satoshi', 'Inter', sans-serif" font-size="30" font-weight="900" fill="#bba2f9">Use: Simple Design Rules That Work</text>
  </g>

  <!-- Lower Right Movie Billing Block -->
  <g transform="translate(1140, 560)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="end">★★★★★ 4.9 · AUDIENCE CHOICE</text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="end">CORALGENZ GLOBAL STUDIOS · KARTHICK KRISHNA (FOUNDER) · THANVANTH H (COO)</text>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#475569" text-anchor="end">100% CODE OWNERSHIP · ZERO LOCK-IN · COIMBATORE &amp; CHENNAI</text>
