      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#260324"/>
    </linearGradient>
    <linearGradient id="horiz-32" x1="0" y1="350" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f230ea" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f9a2f6" stop-opacity="1"/>
