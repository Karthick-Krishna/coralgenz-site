        <!-- Hyperdrive Launch Rocket -->
        <ellipse cx="0" cy="20" rx="110" ry="55" stroke="#f230ea" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.4" transform="rotate(-20)"/>
