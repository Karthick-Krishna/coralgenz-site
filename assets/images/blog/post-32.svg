    </linearGradient>
  </defs>

  <!-- Upper Panoramic Half -->
  <rect width="1200" height="350" fill="url(#bg-top-32)"/>
  <!-- Lower Dark Card -->
  <rect y="350" width="1200" height="325" fill="#040814"/>

