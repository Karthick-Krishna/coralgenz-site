  <line x1="0" y1="350" x2="1200" y2="350" stroke="url(#horiz-32)" stroke-width="3"/>
  <circle cx="600" cy="350" r="30" fill="#f230ea" opacity="0.3"/>

  <!-- Upper Focal Artwork -->
