        <circle cx="0" cy="-10" r="14" fill="#0f172a" stroke="#f9a2f6" stroke-width="2.5"/>
        <circle cx="0" cy="-10" r="6" fill="#38bdf8"/>
        <polygon points="-12 85 0 115 12 85" fill="#ef4444"/>
        <polygon points="-6 85 0 102 6 85" fill="#f59e0b"/>
        <path d="M -35 25 L -55 60 L -30 68 Z" fill="#f230ea"/>
        <path d="M 35 25 L 55 60 L 30 68 Z" fill="#f230ea"/>
        
  </g>

  <!-- Top Studio Bar -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2">CORALGENZ CINEMATIC</text>
    <text x="1080" y="0" font-family="'Inter', monospace" font-size="12" font-weight="700" fill="#f9a2f6" text-anchor="end">#32 · STARTUPS &amp; MVP</text>
  </g>

  <!-- Lower Title Card Content -->
  <g transform="translate(60, 410)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#f230ea" letter-spacing="3">FROM NAPKIN CONCEPT TO PRODUCTION IN 28 DAYS.</text>
    <text x="0" y="45" font-family="'Satoshi', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">How We Help Startups Build and</text>
    <text x="0" y="86" font-family="'Satoshi', 'Inter', sans-serif" font-size="30" font-weight="900" fill="#f9a2f6">Launch Products Faster</text>
  </g>

  <!-- Lower Right Movie Billing Block -->
  <g transform="translate(1140, 560)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="end">★★★★★ 4.9 · AUDIENCE CHOICE</text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="end">CORALGENZ GLOBAL STUDIOS · KARTHICK KRISHNA &amp; THANVANTH H</text>
