<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-top-2" x1="0" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#03260d"/>
    </linearGradient>
    <linearGradient id="horiz-2" x1="0" y1="350" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30f268" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a2f9bb" stop-opacity="1"/>
      <stop offset="1" stop-color="#30f268" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Upper Panoramic Half -->
  <rect width="1200" height="350" fill="url(#bg-top-2)"/>
  <!-- Lower Dark Card -->
  <rect y="350" width="1200" height="325" fill="#040814"/>

  <!-- Horizon Laser Divider Line -->
  <line x1="0" y1="350" x2="1200" y2="350" stroke="url(#horiz-2)" stroke-width="3"/>
  <circle cx="600" cy="350" r="30" fill="#30f268" opacity="0.3"/>

  <!-- Upper Focal Artwork -->
  <g transform="translate(600, 180)">
    
        <!-- 4-Tier Clean Architecture Isometric Monolith -->
        <rect x="-80" y="-70" width="160" height="28" rx="6" fill="#03260d" stroke="#30f268" stroke-width="2"/>
        <rect x="-65" y="-30" width="130" height="28" rx="6" fill="#03260d" stroke="#a2f9bb" stroke-width="2"/>
        <rect x="-50" y="10" width="100" height="28" rx="6" fill="#03260d" stroke="#bc22e5" stroke-width="2"/>
        <rect x="-35" y="50" width="70" height="28" rx="6" fill="#03260d" stroke="#30f268" stroke-width="2"/>
        <line x1="0" y1="-42" x2="0" y2="-30" stroke="#a2f9bb" stroke-width="2" stroke-dasharray="2 2"/>
        <line x1="0" y1="-2" x2="0" y2="10" stroke="#bc22e5" stroke-width="2" stroke-dasharray="2 2"/>
        <line x1="0" y1="38" x2="0" y2="50" stroke="#30f268" stroke-width="2" stroke-dasharray="2 2"/>
        
  </g>

  <!-- Top Studio Bar -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2">CORALGENZ CINEMATIC</text>
    <text x="1080" y="0" font-family="'Inter', monospace" font-size="12" font-weight="700" fill="#a2f9bb" text-anchor="end">#2 · CUSTOM SOFTWARE</text>
  </g>

  <!-- Lower Title Card Content -->
  <g transform="translate(60, 410)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#30f268" letter-spacing="3">ENTERPRISE SOFTWARE BUILT TO LAST A GENERATION.</text>
    <text x="0" y="45" font-family="'Satoshi', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">Why Good Business Software Does Not</text>
    <text x="0" y="86" font-family="'Satoshi', 'Inter', sans-serif" font-size="30" font-weight="900" fill="#a2f9bb">Have to Be Expensive or Hard to Use</text>
  </g>

  <!-- Lower Right Movie Billing Block -->
  <g transform="translate(1140, 560)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="end">★★★★★ 4.9 · AUDIENCE CHOICE</text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="end">CORALGENZ GLOBAL STUDIOS · KARTHICK KRISHNA (FOUNDER) · THANVANTH H (COO)</text>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#475569" text-anchor="end">100% CODE OWNERSHIP · ZERO LOCK-IN · COIMBATORE &amp; CHENNAI</text>
  </g>
</svg>